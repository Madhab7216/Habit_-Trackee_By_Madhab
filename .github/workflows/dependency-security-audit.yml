name: Dependency security audit

on:
  push:
    branches: ["work/release-security-baseline"]
  pull_request:
    branches: ["main", "work/linux-mint-habit-tracker-foundation"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit resolved Rust dependencies
        run: cargo audit
