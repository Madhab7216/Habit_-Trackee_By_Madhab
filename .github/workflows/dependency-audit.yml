name: Dependency security

on:
  push:
    branches:
      - main
      - work/linux-mint-habit-tracker-foundation
      - work/security-supply-chain
  pull_request:
    branches:
      - main
      - work/linux-mint-habit-tracker-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: Audit resolved Rust dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Resolve the current dependency graph
        run: cargo generate-lockfile

      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Check dependencies against the RustSec advisory database
        run: cargo audit
