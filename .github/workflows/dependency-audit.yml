name: Dependency security audit

on:
  push:
    branches:
      - work/m9-security-supply-chain
      - work/linux-mint-habit-tracker-foundation
  pull_request:
    branches:
      - work/linux-mint-habit-tracker-foundation
  schedule:
    # Monday 06:30 Asia/Kolkata (01:00 UTC).
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisory database audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0

      - name: Resolve the current dependency graph
        run: cargo generate-lockfile

      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit resolved dependencies
        run: cargo audit --file Cargo.lock
