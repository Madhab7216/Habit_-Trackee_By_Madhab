name: Release candidate gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Existing release candidate tag, e.g. v0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.inputs.candidate_ref || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the selected candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact tag and fail-closed release preflight
        env:
          CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || github.ref }}
        run: |
          set -euo pipefail
          candidate="${CANDIDATE_REF#refs/tags/}"
          git show-ref --verify --quiet "refs/tags/$candidate"
          checked_out_tag="$(git describe --tags --exact-match HEAD)"
          test "$checked_out_tag" = "$candidate"
          python3 scripts/check-release-readiness.py --root . --ref "$candidate"

      - name: Install GTK and desktop metadata build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev appstream desktop-file-utils

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify locked dependency metadata
        run: cargo metadata --locked --format-version 1 --no-deps > candidate-metadata.json

      - name: Compile all targets with the committed lockfile
        run: cargo check --locked --all-targets

      - name: Run all Rust tests with the committed lockfile
        run: cargo test --locked --all-targets

      - name: Run strict Clippy with the committed lockfile
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run schema and SBOM validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate desktop launcher
        run: desktop-file-validate packaging/org.madhab.habittracker.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --pedantic packaging/org.madhab.habittracker.metainfo.xml

      - name: Validate desktop metadata references
        run: python3 scripts/validate-desktop-metadata.py

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked

      - name: Generate CycloneDX 1.7 SBOM from the exact candidate lockfile
        run: cargo cyclonedx --format json --spec-version 1.7 --override-filename sbom -qq

      - name: Validate candidate SBOM
        run: python3 scripts/validate_sbom.py sbom.json

      - name: Create release evidence checksums
        run: |
          sha256sum sbom.json > sbom.json.sha256
          sha256sum candidate-metadata.json > candidate-metadata.json.sha256

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: madhab-release-evidence-${{ github.sha }}
          path: |
            sbom.json
            sbom.json.sha256
            candidate-metadata.json
            candidate-metadata.json.sha256
          if-no-files-found: error
          retention-days: 90
