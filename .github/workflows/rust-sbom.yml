name: Rust software bill of materials

on:
  push:
    branches:
      - work/release-sbom
      - work/linux-mint-habit-tracker-foundation
  workflow_dispatch:
  schedule:
    # Weekly inventory refresh. GitHub runs scheduled workflows from the default branch.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: rust-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate and validate CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0

      - name: Resolve the dependency graph for this commit
        run: cargo generate-lockfile

      - name: Install pinned CycloneDX Cargo generator
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked

      - name: Generate CycloneDX 1.7 JSON
        run: cargo cyclonedx --format json --spec-version 1.7 --override-filename sbom -qq

      - name: Validate SBOM structure and project dependencies
        run: python3 scripts/validate_sbom.py sbom.json

      - name: Create SBOM checksum
        run: sha256sum sbom.json > sbom.json.sha256

      - name: Upload SBOM and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habit-trackers-cyclonedx-sbom-${{ github.sha }}
          path: |
            sbom.json
            sbom.json.sha256
          if-no-files-found: error
          retention-days: 90
